name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRFLOW_VERSION: "3.3.1"
      PYTHON_VERSION: "3.12"
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Airflow with official constraints
        shell: bash
        run: |
          python -m pip install --upgrade pip
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          python -m pip install \
            "apache-airflow==${AIRFLOW_VERSION}" \
            apache-airflow-providers-standard \
            --constraint "${CONSTRAINT_URL}"
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -c "from airflow.sdk import DAG, ObjectStoragePath, task; print('airflow.sdk import smoke: OK')"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Unit and DAG integrity tests
        run: pytest --cov --cov-report=term-missing

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: Scaffold end-to-end smoke
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          git archive HEAD | tar -x -C "$scratch"

          python "$scratch/scripts/bootstrap_project.py" ci_smoke --root "$scratch"
          python "$scratch/scripts/new_job.py" customer_sync --type simple --root "$scratch"
          python "$scratch/scripts/new_job.py" billing_pipeline --type workflow --root "$scratch"
          python "$scratch/scripts/new_job.py" portal_update --type isolated --root "$scratch"

          (
            cd "$scratch"
            python -m compileall -q src dags scripts tests examples
            python scripts/check_secrets.py
            ruff check .
            ruff format --check .
            PYTHONPATH="$scratch/src" pytest -q tests/unit/scripts tests/unit/jobs
          )

      - name: Package build check
        shell: bash
        run: |
          rm -rf dist
          python -m pip wheel --no-deps . --wheel-dir dist
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1

      - name: Airflow import and execution smoke
        shell: bash
        run: |
          airflow db migrate

          # Parse directly from the configured DAG folder first. Airflow 3's
          # non-local list commands read serialized DAGs from the metadata DB.
          airflow dags list --local
          AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR PYTHONWARNINGS=ignore \
            airflow dags list-import-errors --local --output json 2>/dev/null \
            | jq -e 'type == "array" and length == 0'

          # Then prove the same DAGs can be serialized into the metadata DB.
          airflow dags reserialize
          airflow dags list
          AIRFLOW__LOGGING__LOGGING_LEVEL=ERROR PYTHONWARNINGS=ignore \
            airflow dags list-import-errors --output json 2>/dev/null \
            | jq -e 'type == "array" and length == 0'

          # Execute the deterministic no-integration example end-to-end.
          airflow dags test example_simple_job 2026-08-21 \
            --dagfile-path "${AIRFLOW__CORE__DAGS_FOLDER}/example_simple_job.py"
